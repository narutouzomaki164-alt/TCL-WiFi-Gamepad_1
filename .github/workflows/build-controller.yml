name: Build WiFi Gamepad APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-controller/**'
      - '.github/workflows/build-controller.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: gradle -p mobile-controller assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Gamepad-APK
          path: mobile-controller/app/build/outputs/apk/debug/app-debug.apk
